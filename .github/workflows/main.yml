name: Build-Mobile-App
on: [push, workflow_dispatch]
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Directory
        run: |
          if [ ! -f "package.json" ] && [ -f "FXLive_GitHub_AutoBuild_Repo/package.json" ]; then
            cp -r FXLive_GitHub_AutoBuild_Repo/* .
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Capacitor Android
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Enable Network Traffic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Export APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./FXLive_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FXLive-Android-APK
          path: ./FXLive_Android.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Align Directory
        run: |
          if [ ! -f "package.json" ] && [ -f "FXLive_GitHub_AutoBuild_Repo/package.json" ]; then
            cp -r FXLive_GitHub_AutoBuild_Repo/* .
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Capacitor iOS & CocoaPods
        run: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Build Unsigned IPA
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          fi
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../FXLive_iOS_Unsigned.ipa Payload
          cd ../..
          zip -r FXLive_iOS_Xcode_Project.zip ios/
      - uses: actions/upload-artifact@v4
        with:
          name: FXLive-iOS-IPA
          path: |
            ./FXLive_iOS_Unsigned.ipa
            ./FXLive_iOS_Xcode_Project.zip
